<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 800px;
    background: #FAF8F4;
    font-family: 'Gill Sans', 'Optima', Georgia, sans-serif;
    padding: 60px 80px 80px;
  }
  .section { margin-bottom: 56px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .section-line { flex: 1; height: 1px; background: #C9A96E; opacity: 0.5; }
  .section-title {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C9A96E;
    white-space: nowrap;
  }
  .notes-row {
    display: flex;
    justify-content: center;
    gap: 48px;
  }
  .note-item { text-align: center; }
  .note-img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
    margin-bottom: 14px;
  }
  .note-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    color: #2A2420;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="section">
  <div class="section-header">
    <div class="section-line"></div>
    <span class="section-title">Top Notes</span>
    <div class="section-line"></div>
  </div>
  <div class="notes-row">
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1490750967868-88df5691cc4d?w=400&q=80" alt="Magnolia">
      <div class="note-label">Magnolia</div>
    </div>
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1572635148818-ef6fd45eb394?w=400&q=80" alt="Bergamot">
      <div class="note-label">Bergamot</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <div class="section-line"></div>
    <span class="section-title">Middle Notes</span>
    <div class="section-line"></div>
  </div>
  <div class="notes-row">
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1611080541599-8c6dbde6ed28?w=400&q=80" alt="Tonka">
      <div class="note-label">Tonka</div>
    </div>
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80" alt="Ylang Ylang">
      <div class="note-label">Ylang Ylang</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <div class="section-line"></div>
    <span class="section-title">Base Notes</span>
    <div class="section-line"></div>
  </div>
  <div class="notes-row">
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1602928298849-325cec8771c0?w=400&q=80" alt="Vanilla">
      <div class="note-label">Vanilla</div>
    </div>
    <div class="note-item">
      <img class="note-img" src="https://images.unsplash.com/photo-1599940778173-e276d4acb2bb?w=400&q=80" alt="Musk">
      <div class="note-label">Musk</div>
    </div>
  </div>
</div>

</body>
</html>
